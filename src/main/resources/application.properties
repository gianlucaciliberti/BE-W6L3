spring.application.name=bank-app
server.port=8080

# --- Database (PostgreSQL) ---
# Modifica username/password con quelli del tuo server PostgreSQL locale.
# NB: a differenza di MySQL, Postgres non crea da solo il database "bankapp":
# vedi il README per il comando da lanciare una volta sola prima del primo avvio.
spring.datasource.url=jdbc:postgresql://localhost:5432/bankapp
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
app.jwt.secret=GQAa9LdDILnDsLFlX9+Hphm0tE19mf9z7RVeyQFBsHwCL4h2FVOvIVDoIjXuz/Dh
app.jwt.expiration-ms=3600000

# --- Codici OTP / token di conferma ---
app.otp.expiration-minutes=5
app.confirmation-token.expiration-hours=24
app.base-url=http://localhost:8080
